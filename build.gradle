plugins { id 'java-library'; id 'net.neoforged.moddev' }
version = '8.0.1'
group = 'net.malisis.core'
base { archivesName = 'malisiscore-compat-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = '21.1.264'; mods { malisiscore { sourceSet(sourceSets.main) } } }
jar { from('../core-legacy/LICENSE.txt') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('verifyCore', JavaExec) { dependsOn testClasses; classpath=sourceSets.test.runtimeClasspath; mainClass='net.malisis.core.checks.CoreChecks' }
check.dependsOn verifyCore

// Contract checks use the explicit verifyCore JavaExec task, not a JUnit engine.
tasks.named('test') { failOnNoDiscoveredTests = false }
