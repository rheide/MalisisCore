buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
version = '1.12.2-7.0.0'
group = 'net.malisis'
archivesBaseName = 'malisiscore-compat'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    accessTransformer = file('src/main/resources/META-INF/malisiscore_at.cfg')
}
repositories { mavenCentral() }
def referenceRuntime = file('../vendor/net/malisis/malisiscore/1.12.2-6.5.1/malisiscore-1.12.2-6.5.1.jar')
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    compileOnly files(referenceRuntime)
}
compileJava.options.compilerArgs += ['-proc:none']
processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand modid:'malisiscore', name:'MalisisCore-compat', description:'Shared rendering, animation, GUI and block framework', version:project.version, buildNumber:'0', mcversion:'1.12.2', url:'https://github.com/Ordinastie/MalisisCore'
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
    from(zipTree(referenceRuntime)) { include 'mixins.malisiscore.refmap.json' }
}
jar {
    from('LICENSE.txt')
    // Preserve the installed runtime's licensed bundled Mixin distribution. The unchanged
    // Mixin targets retain its matching generated refmap; sources remain in this project.
    from(zipTree(referenceRuntime)) {
        include 'org/spongepowered/**', 'META-INF/services/org.spongepowered*', 'mixin*LICENSE*'
    }
    manifest { attributes 'Implementation-Title':'MalisisCore', 'Implementation-Version':project.version,
        'FMLCorePlugin':'net.malisis.core.asm.MalisisCorePlugin', 'FMLCorePluginContainsFMLMod':true,
        'ForceLoadAsMod':true, 'TweakClass':'org.spongepowered.asm.launch.MixinTweaker',
        'TweakOrder':0, 'MixinConfigs':'mixins.malisiscore.core.json', 'FMLAT':'malisiscore_at.cfg' }
}
jar.finalizedBy('reobfJar')
task writeBenchmarkClasspath { dependsOn classes; doLast { file('../core-benchmark-classpath.txt').text = sourceSets.main.runtimeClasspath.asPath } }
task compileRenderChecks(type: JavaCompile) {
    dependsOn classes
    source = fileTree('src/testsupport/java') { include '**/*.java' }
    classpath = sourceSets.main.runtimeClasspath
    destinationDir = file("$buildDir/render-checks/classes")
    sourceCompatibility = targetCompatibility = '1.8'
    options.compilerArgs += ['-proc:none']
}
task testRenderParity(type: JavaExec) {
    dependsOn compileRenderChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileRenderChecks.destinationDir)
    main = 'net.malisis.core.checks.RenderParityChecks'
    doFirst {
        def reference = file('../benchmark-classpath.txt').text.split(File.pathSeparator).find { it.contains('malisiscore') && it.endsWith('.jar') }
        args reference
    }
}
check.dependsOn testRenderParity
